name: Build Service Hub
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build full app
        run: |
          rm -rf backend frontend
          mkdir -p backend/routes backend/models frontend/src/pages frontend/src/components
          cat > render.yaml << 'EOF'
          services:
            - type: web
              name: service-hub-backend
              env: node
              rootDir: backend
              buildCommand: npm install
              startCommand: npm start
              envVars:
                - key: NODE_ENV
                  value: production
            - type: web
              name: service-hub-frontend
              env: static
              rootDir: frontend
              buildCommand: npm install && npm run build
              staticPublishPath: ./dist
          EOF
          cat > backend/package.json << 'EOF'
          {"name":"service-hub-backend","type":"module","dependencies":{"express":"^4.18.2","cors":"^2.8.5","mongoose":"^8.0.0","jsonwebtoken":"^9.0.2","bcryptjs":"^2.4.3","multer":"^1.4.5-lts.1","socket.io":"^4.7.4"}}
          EOF
          cat > backend/server.js << 'EOF'
          import express from 'express'; import cors from 'cors'; import { createServer } from 'http'; import { Server } from 'socket.io';
          const app=express(); const httpServer=createServer(app);
          const io=new Server(httpServer,{cors:{origin:"*"}});
          app.use(cors()); app.use(express.json());
          app.get('/',(req,res)=>res.json({status:"Service Hub Backend Live",services:["plumbing","electrical","cleaning"]}));
          app.get('/api/services',(req,res)=>res.json([{id:1,name:"Plumbing",price:500},{id:2,name:"Electrical",price:600},{id:3,name:"Cleaning",price:400}]));
          app.get('/api/bookings',(req,res)=>res.json([]));
          io.on('connection',s=>{console.log('user connected'); s.on('track',d=>{s.emit('location',{lat:-22.38,lng:26.71})})});
          const PORT=process.env.PORT||10000; httpServer.listen(PORT,()=>console.log('Backend running on '+PORT));
          EOF
          cat > frontend/package.json << 'EOF'
          {"name":"service-hub-frontend","type":"module","scripts":{"dev":"vite","build":"vite build"},"dependencies":{"react":"^18.2.0","react-dom":"^18.2.0","axios":"^1.6.0","socket.io-client":"^4.7.4"},"devDependencies":{"vite":"^5.0.0","@vitejs/plugin-react":"^4.2.0"}}
          EOF
          cat > frontend/vite.config.js << 'EOF'
          import { defineConfig } from 'vite'; import react from '@vitejs/plugin-react'; export default defineConfig({plugins:[react()]});
          EOF
          cat > frontend/index.html << 'EOF'
          <!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><title>Service Hub</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
          EOF
          cat > frontend/src/main.jsx << 'EOF'
          import React from 'react'; import ReactDOM from 'react-dom/client'; import App from './App.jsx'; ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
          EOF
          cat > frontend/src/App.jsx << 'EOF'
          import { useEffect, useState } from 'react';
          export default function App(){
            const [services,setServices]=useState([]);
            useEffect(()=>{fetch('https://service-hub-backend.onrender.com/api/services').then(r=>r.json()).then(setServices).catch(()=>setServices([{name:"Plumbing"},{name:"Electrical"}]))},[]);
            return (<div style={{fontFamily:'sans-serif',padding:20}}>
              <h1>🔧 Service Hub - Botswana</h1>
              <p>Book plumbing, electrical, cleaning services with live tracking</p>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                {services.map((s,i)=><div key={i} style={{border:'1px solid #ccc',padding:15,borderRadius:8}}><h3>{s.name}</h3><p>P {s.price||500}</p><button onClick={()=>alert('Booking '+s.name)}>Book Now</button></div>)}
              </div>
              <hr/><h3>Features: Real-time tracking, WhatsApp notifications, Pay with Orange Money</h3>
            </div>);
          }
          EOF
          git config user.name "builder"; git config user.email "builder@bot.com";
          git add .; git commit -m "Build full Service Hub" || echo "no changes"; git push
